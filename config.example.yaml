# ============================================================
# Paper-RAG Configuration Template
# Copy to config.yaml, then create .env with your API keys.
# All secrets and model names go in .env — config.yaml only references them.
# ============================================================

# --- Zotero ---
zotero:
  data_dir: ""              # Auto-detect, or set manually e.g., C:/Users/you/Zotero
  profile: ""

# --- Local PDF directory (alternative to Zotero) ---
pdf_dir:
  path: ""
  recursive: true

# --- Embedding model ---
# provider: "api" (OpenAI-compatible) or "local" (sentence-transformers)
embedding:
  provider: "api"
  api_base: "${EMBEDDING_API_BASE}"
  api_key: "${SILICONFLOW_API_KEY}"
  model: "${EMBEDDING_MODEL}"
  batch_size: 20
  dimensions: 4096

# --- Chat LLM (OpenAI-compatible API) ---
llm:
  api_base: "${LLM_API_BASE}"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "${LLM_MODEL}"
  temperature: 0.3
  max_tokens: 2048

# --- Chunking ---
chunking:
  chunk_size: 1000
  chunk_overlap: 150
  keep_abstract_separate: true
  keep_metadata: true

# --- Vector store ---
vector_store:
  path: "./data/chroma"
  collection: "papers"

# --- Retrieval ---
retrieval:
  top_k: 8
  rerank: false
  min_score: 0.0

# --- PDF parsing ---
pdf:
  max_pages_per_paper: 100
